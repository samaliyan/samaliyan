<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Oracle DBA core expertise">
<defs>
<linearGradient id="line"><stop stop-color="#ff4d3d"/><stop offset=".5" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
<style>
.label{font:700 9px 'Trebuchet MS',sans-serif;fill:#ff8a1f;letter-spacing:1.5px}
.skill{font:700 13px 'Trebuchet MS',sans-serif;fill:#fff4e6}
.desc{font:10px 'Trebuchet MS',sans-serif;fill:#bda7a2}
.footer{font:700 9px 'Trebuchet MS',sans-serif;fill:#bda7a2;letter-spacing:1.3px}
@keyframes reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.reveal{animation:reveal .7s cubic-bezier(.32,.72,0,1) both}
@media(prefers-reduced-motion:reduce){.reveal{animation:none}}
</style></defs>
<rect width="900" height="290" rx="26" fill="#171012"/>
<rect x="7" y="7" width="886" height="276" rx="21" fill="#0f0b0c" stroke="#4b2524"/>
<path d="M29 42h842" stroke="url(#line)"/>
<text x="31" y="39" class="label">CORE EXPERTISE / ORACLE DATABASE ADMINISTRATION</text>
<g transform="translate(31 72)" class="reveal" style="animation-delay:0.00s"><rect width="252" height="76" rx="14" fill="#140e0f" stroke="#4d2523"/><circle cx="20" cy="20" r="4" fill="#ff4d3d"/><text x="34" y="24" class="skill">Oracle Database</text><text x="20" y="51" class="desc">Administration · architecture</text></g>
<g transform="translate(303 72)" class="reveal" style="animation-delay:0.07s"><rect width="252" height="76" rx="14" fill="#140e0f" stroke="#4d2523"/><circle cx="20" cy="20" r="4" fill="#ff8a1f"/><text x="34" y="24" class="skill">Data Guard</text><text x="20" y="51" class="desc">Standby · switchover · DR</text></g>
<g transform="translate(575 72)" class="reveal" style="animation-delay:0.14s"><rect width="252" height="76" rx="14" fill="#140e0f" stroke="#4d2523"/><circle cx="20" cy="20" r="4" fill="#ffc857"/><text x="34" y="24" class="skill">Oracle RAC</text><text x="20" y="51" class="desc">Clustered availability</text></g>
<g transform="translate(31 164)" class="reveal" style="animation-delay:0.21s"><rect width="252" height="76" rx="14" fill="#140e0f" stroke="#4d2523"/><circle cx="20" cy="20" r="4" fill="#ff4d3d"/><text x="34" y="24" class="skill">RMAN</text><text x="20" y="51" class="desc">Backup · recovery · restore</text></g>
<g transform="translate(303 164)" class="reveal" style="animation-delay:0.28s"><rect width="252" height="76" rx="14" fill="#140e0f" stroke="#4d2523"/><circle cx="20" cy="20" r="4" fill="#ff8a1f"/><text x="34" y="24" class="skill">PL/SQL</text><text x="20" y="51" class="desc">Database-side automation</text></g>
<g transform="translate(575 164)" class="reveal" style="animation-delay:0.35s"><rect width="252" height="76" rx="14" fill="#140e0f" stroke="#4d2523"/><circle cx="20" cy="20" r="4" fill="#ffc857"/><text x="34" y="24" class="skill">Performance Tuning</text><text x="20" y="51" class="desc">SQL · waits · diagnostics</text></g>
