<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Featured project KeySwitchFix">
<defs>
  <radialGradient id="flare" cx="82%" cy="47%" r="57%">
    <stop offset="0" stop-color="#ff4d3d" stop-opacity=".20"/>
    <stop offset=".48" stop-color="#ff8a1f" stop-opacity=".07"/>
    <stop offset="1" stop-color="#090708" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="line"><stop stop-color="#ff4d3d"/><stop offset=".5" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .title{font:700 36px 'Trebuchet MS',sans-serif;fill:#fff4e6;letter-spacing:-.6px}
    .label{font:700 9px 'Trebuchet MS',sans-serif;fill:#ff8a1f;letter-spacing:1.7px}
    .body{font:13px 'Trebuchet MS',sans-serif;fill:#bda7a2}
    .tag{font:700 10px 'Trebuchet MS',sans-serif;fill:#fff4e6}
    .key{font:700 21px 'Trebuchet MS',sans-serif;fill:#fff4e6}
    .metric{font:700 22px 'Trebuchet MS',sans-serif;fill:#fff4e6}
    .small{font:9px 'Trebuchet MS',sans-serif;fill:#bda7a2;letter-spacing:1px}
    .cta{font:700 10px 'Trebuchet MS',sans-serif;fill:#ffc857;letter-spacing:1.3px}
    @keyframes pulse{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(54px)}}
    .pulse{animation:pulse 2.6s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
  </style>
</defs>
