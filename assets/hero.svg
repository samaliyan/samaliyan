.tiny{font:10px 'Trebuchet MS',sans-serif;fill:#bda7a2;letter-spacing:1px}
@keyframes drift{50%{transform:rotate(7deg)}}.orbit{transform-origin:730px 145px;animation:drift 7s cubic-bezier(.32,.72,0,1) infinite}
