<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Profile banner for Sam Aliyan">
<defs>
<radialGradient id="flare" cx="78%" cy="42%" r="54%"><stop offset="0" stop-color="#ff4d3d" stop-opacity=".32"/><stop offset=".46" stop-color="#ff8a1f" stop-opacity=".1"/><stop offset="1" stop-color="#090708" stop-opacity="0"/></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4d3d"/><stop offset=".52" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.display{font:700 42px 'Trebuchet MS',sans-serif;fill:#fff4e6;letter-spacing:-1.2px}
.role{font:700 19px 'Trebuchet MS',sans-serif;fill:#fff4e6}
.label{font:700 10px 'Trebuchet MS',sans-serif;fill:#ff8a1f;letter-spacing:2px}
.body{font:14px 'Trebuchet MS',sans-serif;fill:#bda7a2}
