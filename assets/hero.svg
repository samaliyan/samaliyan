</style></defs>
<rect width="900" height="300" rx="26" fill="#171012"/><rect x="7" y="7" width="886" height="286" rx="21" fill="#0f0b0c" stroke="#4b2524"/><rect x="7" y="7" width="886" height="286" rx="21" fill="url(#flare)"/>
<path d="M29 41h330" stroke="url(#rim)" stroke-width="2"/><circle cx="29" cy="41" r="4" fill="#ff4d3d"/><text x="42" y="69" class="label">ORACLE DATABASE / PROFILE</text>
<text x="42" y="126" class="display">Sam Aliyan</text>
<text x="42" y="162" class="role">Oracle Database Administrator</text>
<text x="42" y="218" class="label">FOCUS</text>
<text x="42" y="244" class="body">Oracle database reliability · recovery · SQL performance</text>
<g class="orbit"><circle cx="730" cy="145" r="100" fill="none" stroke="#5d2925"/><circle cx="730" cy="145" r="76" fill="none" stroke="#351919" stroke-dasharray="3 8"/><path d="M641 100a100 100 0 0 1 178 96" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linecap="round"/><circle cx="641" cy="100" r="6" fill="#ff4d3d" filter="url(#glow)"/><circle cx="819" cy="196" r="5" fill="#ffc857"/></g>
<text x="730" y="139" text-anchor="middle" class="hero">ORACLE DBA</text>
